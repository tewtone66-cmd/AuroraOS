name: Build Aurora OS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare web app
        run: npm run prepare:web
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          import re
          s = open('src/index.html', encoding='utf-8').read()
          open('/tmp/aurora.js', 'w', encoding='utf-8').write('\n'.join(re.findall(r'<script>(.*?)</script>', s, re.S)))
          PY
          node --check /tmp/aurora.js
      - name: Add Android platform
        run: npx cap add android
      - name: Build launcher icon and splash
        run: |
          npm install --no-save sharp
          node scripts/make-icons.mjs
      - name: Patch Android project
        run: python3 scripts/patch-android.py
      - name: Fetch Winlator assets (pinned commit)
        run: |
          set -e
          SHA=8077f374ef2d54127b088de9e8cd7b4af14d9c8b
          mkdir -p /tmp/winlator-app
          cd /tmp/winlator-app
          git init -q
          git remote add origin https://github.com/brunodev85/winlator-app.git
          git fetch --depth 1 origin $SHA
          git checkout -q FETCH_HEAD
          cd "$GITHUB_WORKSPACE"
          mkdir -p android/app/src/main/assets
          cp -r /tmp/winlator-app/app/src/main/assets/. android/app/src/main/assets/
          rm -rf android/app/src/main/assets/wallpapers android/app/src/main/assets/soundfont
          test -s android/app/src/main/assets/rootfs.tzst
          test -s android/app/src/main/assets/container_pattern.tzst
          test -s android/app/src/main/assets/common_dlls.json
          ls -la android/app/src/main/assets
      - name: Patch Winlator infra (targetSdk 28, arm64, deps)
        run: python3 scripts/patch-winlator.py
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AuroraOS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
