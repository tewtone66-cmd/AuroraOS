name: Build Aurora OS APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare web app
        run: npm run prepare:web
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          import re
          s = open('src/index.html', encoding='utf-8').read()
          open('/tmp/aurora.js', 'w', encoding='utf-8').write('\n'.join(re.findall(r'<script>(.*?)</script>', s, re.S)))
          PY
          node --check /tmp/aurora.js
      - name: Add Android platform
        run: npx cap add android
      - name: Build launcher icon and splash
        run: |
          npm install --no-save sharp
          node scripts/make-icons.mjs
      - name: Patch Android project
        run: python3 scripts/patch-android.py
      - name: Install NDK and CMake (Winlator core)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;24.0.8215888" "cmake;3.22.1"
      - name: Integrate Winlator core
        run: python3 scripts/setup-winlator.py
      - name: Patch EXE window
        run: python3 scripts/patch-exe-window.py
      - name: Patch EXE diagnostics
        run: python3 scripts/patch-exe-diagnostics.py
      - name: Patch EXE embed
        run: python3 scripts/patch-exe-embed.py
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AuroraOS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
