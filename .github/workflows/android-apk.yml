name: Build Aurora OS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore original Aurora OS web app
        run: npm run prepare:web
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Set landscape orientation and launcher icon
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          content = manifest.read_text(encoding='utf-8')

          # Capacitor's generated XML may put the tag name and attributes on separate lines.
          activity = re.search(r'<activity\b[^>]*>', content, re.DOTALL)
          application = re.search(r'<application\b[^>]*>', content, re.DOTALL)
          if not activity or not application:
              raise SystemExit('Could not locate activity/application tags in AndroidManifest.xml')

          activity_tag = activity.group(0)
          if 'android:screenOrientation=' in activity_tag:
              activity_tag = re.sub(r'android:screenOrientation="[^"]*"', 'android:screenOrientation="landscape"', activity_tag)
          else:
              activity_tag = activity_tag[:-1] + ' android:screenOrientation="landscape">'

          content = content[:activity.start()] + activity_tag + content[activity.end():]
          application = re.search(r'<application\b[^>]*>', content, re.DOTALL)
          app_tag = application.group(0)
          if 'android:icon=' in app_tag:
              app_tag = re.sub(r'android:icon="[^"]*"', 'android:icon="@drawable/aurora_launcher"', app_tag)
          else:
              app_tag = app_tag[:-1] + ' android:icon="@drawable/aurora_launcher">'

          content = content[:application.start()] + app_tag + content[application.end():]
          manifest.write_text(content, encoding='utf-8')

          # Hide Android's native status/navigation bars so the app uses the full display.
          # The Aurora dock remains the app's own taskbar; Android's battery/status strip is not overlaid.
          import json
          app_id = json.loads(Path('capacitor.config.json').read_text(encoding='utf-8'))['appId']
          activity_file = Path('android/app/src/main/java') / Path(*app_id.split('.')) / 'MainActivity.java'
          activity_file.parent.mkdir(parents=True, exist_ok=True)
          activity_file.write_text(f'''package {app_id};

          import android.os.Bundle;
          import android.view.View;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{
              private void enterImmersiveMode() {{
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                  );
              }}

              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  registerPlugin(AuroraFilesPlugin.class);
                  super.onCreate(savedInstanceState);
                  enterImmersiveMode();
              }}

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {{
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) enterImmersiveMode();
              }}
          }}
          ''', encoding='utf-8')
          plugin_file = activity_file.with_name('AuroraFilesPlugin.java')
          plugin_file.write_text('''package com.auroraos.desktop;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.provider.DocumentsContract;
          import android.webkit.MimeTypeMap;
          import com.getcapacitor.ActivityCallback;
          import com.getcapacitor.ActivityResult;
          import com.getcapacitor.CapacitorPlugin;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;

          @CapacitorPlugin(name = "AuroraFiles")
          public class AuroraFilesPlugin extends Plugin {
              @PluginMethod
              public void openExternal(PluginCall call) {
                  String url = call.getString("url", "");
                  if (!(url.startsWith("https://") || url.startsWith("http://"))) {
                      call.reject("Only http and https links are allowed");
                      return;
                  }
                  try {
                      Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(intent);
                      call.resolve();
                  } catch (ActivityNotFoundException e) {
                      call.reject("No browser is installed", e);
                  } catch (Exception e) {
                      call.reject("Could not open browser", e);
                  }
              }

              @PluginMethod
              public void pickDirectory(PluginCall call) {
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                  intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION
                      | Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                      | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION
                      | Intent.FLAG_GRANT_PREFIX_URI_PERMISSION);
                  startActivityForResult(call, intent, "directoryPicked");
              }

              @ActivityCallback
              private void directoryPicked(PluginCall call, ActivityResult result) {
                  if (call == null) return;
                  if (result.getResultCode() != Activity.RESULT_OK || result.getData() == null
                      || result.getData().getData() == null) {
                      call.resolve(new JSObject());
                      return;
                  }
                  Intent data = result.getData();
                  Uri uri = data.getData();
                  try {
                      int flags = data.getFlags() & (Intent.FLAG_GRANT_READ_URI_PERMISSION
                          | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                      getContext().getContentResolver().takePersistableUriPermission(uri, flags);
                  } catch (Exception ignored) { }
                  String docId;
                  try { docId = DocumentsContract.getTreeDocumentId(uri); }
                  catch (Exception e) { docId = ""; }
                  JSObject out = new JSObject();
                  out.put("uri", uri.toString());
                  out.put("documentId", docId);
                  out.put("name", queryName(DocumentsContract.buildDocumentUriUsingTree(uri, docId), "Selected folder"));
                  call.resolve(out);
              }

              @PluginMethod
              public void listDirectory(PluginCall call) {
                  String raw = call.getString("treeUri");
                  if (raw == null || raw.isEmpty()) { call.reject("Folder is not selected"); return; }
                  Uri treeUri = Uri.parse(raw);
                  String rootId;
                  try { rootId = DocumentsContract.getTreeDocumentId(treeUri); }
                  catch (Exception e) { call.reject("Invalid folder permission", e); return; }
                  String documentId = call.getString("documentId", rootId);
                  if (documentId == null || documentId.isEmpty()) documentId = rootId;
                  Uri childrenUri = DocumentsContract.buildChildDocumentsUriUsingTree(treeUri, documentId);
                  String[] columns = {
                      DocumentsContract.Document.COLUMN_DOCUMENT_ID,
                      DocumentsContract.Document.COLUMN_DISPLAY_NAME,
                      DocumentsContract.Document.COLUMN_MIME_TYPE,
                      DocumentsContract.Document.COLUMN_SIZE,
                      DocumentsContract.Document.COLUMN_LAST_MODIFIED
                  };
                  JSObject out = new JSObject();
                  org.json.JSONArray items = new org.json.JSONArray();
                  try (Cursor cursor = getContext().getContentResolver().query(childrenUri, columns, null, null,
                      DocumentsContract.Document.COLUMN_DISPLAY_NAME + " ASC")) {
                      if (cursor != null) {
                          while (cursor.moveToNext()) {
                              String id = cursor.getString(0);
                              String name = cursor.getString(1);
                              String mime = cursor.getString(2);
                              long size = cursor.isNull(3) ? -1L : cursor.getLong(3);
                              long modified = cursor.isNull(4) ? 0L : cursor.getLong(4);
                              boolean directory = DocumentsContract.Document.MIME_TYPE_DIR.equals(mime);
                              Uri documentUri = DocumentsContract.buildDocumentUriUsingTree(treeUri, id);
                              JSObject item = new JSObject();
                              item.put("documentId", id);
                              item.put("name", name == null ? "Unnamed" : name);
                              item.put("mimeType", mime == null ? "*/*" : mime);
                              item.put("size", size);
                              item.put("lastModified", modified);
                              item.put("isDirectory", directory);
                              item.put("uri", documentUri.toString());
                              items.put(item);
                          }
                      }
                  } catch (Exception e) {
                      call.reject("Could not read selected folder", e);
                      return;
                  }
                  out.put("items", items);
                  out.put("treeUri", treeUri.toString());
                  out.put("documentId", documentId);
                  out.put("rootDocumentId", rootId);
                  out.put("name", queryName(DocumentsContract.buildDocumentUriUsingTree(treeUri, documentId), "Selected folder"));
                  call.resolve(out);
              }

              @PluginMethod
              public void parentDirectory(PluginCall call) {
                  String raw = call.getString("treeUri");
                  String current = call.getString("documentId", "");
                  if (raw == null) { call.reject("Folder is not selected"); return; }
                  Uri treeUri = Uri.parse(raw);
                  String root = DocumentsContract.getTreeDocumentId(treeUri);
                  if (current == null || current.isEmpty() || current.equals(root)) {
                      JSObject atRoot = new JSObject();
                      atRoot.put("documentId", root);
                      call.resolve(atRoot);
                      return;
                  }
                  int slash = current.lastIndexOf('/');
                  String parent = slash >= 0 ? current.substring(0, slash) : root;
                  if (parent.isEmpty()) parent = root;
                  JSObject out = new JSObject();
                  out.put("documentId", parent);
                  out.put("name", queryName(DocumentsContract.buildDocumentUriUsingTree(treeUri, parent), "Folder"));
                  call.resolve(out);
              }

              @PluginMethod
              public void openFile(PluginCall call) {
                  String raw = call.getString("uri", "");
                  if (raw.isEmpty()) { call.reject("No file selected"); return; }
                  String mime = call.getString("mimeType", "*/*");
                  try {
                      Intent intent = new Intent(Intent.ACTION_VIEW);
                      intent.setDataAndType(Uri.parse(raw), mime);
                      intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(intent);
                      call.resolve();
                  } catch (ActivityNotFoundException e) {
                      call.reject("No compatible app can open this file", e);
                  } catch (Exception e) {
                      call.reject("Could not open file", e);
                  }
              }

              private String queryName(Uri uri, String fallback) {
                  String[] columns = { DocumentsContract.Document.COLUMN_DISPLAY_NAME };
                  try (Cursor c = getContext().getContentResolver().query(uri, columns, null, null, null)) {
                      if (c != null && c.moveToFirst()) {
                          String name = c.getString(0);
                          if (name != null && !name.isEmpty()) return name;
                      }
                  } catch (Exception ignored) { }
                  return fallback;
              }
          }
          ''', encoding='utf-8')
          print('Android manifest updated: landscape orientation, Aurora icon, immersive fullscreen')
          PY
          npm install --no-save sharp
          node -e "const sharp=require('sharp'); sharp('assets/aurora-icon.svg').resize(1024,1024).png().toFile('assets/aurora-icon.png')"
          mkdir -p android/app/src/main/res/drawable
          cp assets/aurora-icon.png android/app/src/main/res/drawable/aurora_launcher.png
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuroraOS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
