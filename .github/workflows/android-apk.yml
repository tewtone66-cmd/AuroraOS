name: Build NexOS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Check files
        run: test -f assets/aurora-icon.svg && test -f capacitor.config.json
      - name: Prepare web app
        run: npm run prepare:web
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          import re
          s = open('src/index.html', encoding='utf-8').read()
          open('/tmp/aurora.js', 'w', encoding='utf-8').write(re.search(r'<script>(.*)</script>', s, re.S).group(1))
          PY
          node --check /tmp/aurora.js
      - name: Add Android platform
        run: npx cap add android
      - name: Build launcher icon
        run: |
          npm install --no-save sharp
          node -e "require('sharp')('assets/aurora-icon.svg').resize(512,512).png().toFile('assets/aurora-icon.png')"
      - name: Patch Android project
        run: python3 scripts/patch-android.py
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NexOS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
